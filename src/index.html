<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advinhe o número</title>
    <link rel="stylesheet" href="@@CSS">
</head>
<body>
    <main>
        <h1>Estou pensando em um número de 0 a 10</h1>
        <h2>Tente advinhar qual é</h2>
        <form id="form-palpite">
            <label for="palpite">Sua resposta:</label>
            <input type="number" id="palpite" required min="0" value="0" step="1" max="10">
            <button type="submit">Enviar palpite</button>
        </form>
        <div id="resultado">
            <span id="resultado-inform"></span>
        </div>
    </main>
</body>
<script src="@@JAVASCRIPT"></script>
</html>
